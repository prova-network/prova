# Prova Testnet Boot Nodes
# These nodes are always-on and serve as initial peer discovery points.
# Format: multiaddr-style addresses (will use libp2p when transport is real)

[[bootnodes]]
id = "boot-1"
label = "EU-West (Amsterdam)"
peer_id = "12D3KooWBoot1AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
addrs = [
    "/dns4/boot1.testnet.prova.network/tcp/9000",
    "/dns4/boot1.testnet.prova.network/udp/9000/quic-v1",
]
validator_addr = "prova1val1000000000000000000000000000"
region = "eu-west"

