[package]
name = "prova-node"
version = "0.1.0"
edition = "2021"
description = "Prova node — storage + compute engine"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prova-chain = { path = "../chain" }

[dev-dependencies]
hex-literal = "0.4"

[[bin]]
name = "prova-node"
path = "src/main.rs"
