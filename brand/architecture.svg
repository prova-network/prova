<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Prova architecture: Client, Prover, Ethereum">
  <defs>
    <linearGradient id="provaTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#5DC3E5"/>
      <stop offset="55%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#0F4C5C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F4C5C" opacity="0.65"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" fill="#ffffff"/>

  <!-- Three role boxes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <!-- Client -->
    <g transform="translate(40, 80)">
      <rect width="200" height="140" rx="16" fill="#fbfcfd" stroke="#cdd5dd" stroke-width="1.2"/>
      <text x="100" y="42" text-anchor="middle" fill="#0F1419" font-size="20" font-weight="500">Client</text>
      <text x="100" y="68" text-anchor="middle" fill="#5b6470" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" letter-spacing="0.1em">UPLOAD · PAY · VERIFY</text>
      <text x="100" y="100" text-anchor="middle" fill="#5b6470" font-size="13">.eth website</text>
      <text x="100" y="118" text-anchor="middle" fill="#5b6470" font-size="13">dataset · AI corpus</text>
    </g>

    <!-- Prover -->
    <g transform="translate(300, 80)">
      <rect width="200" height="140" rx="16" fill="#fbfcfd" stroke="#cdd5dd" stroke-width="1.2"/>
      <text x="100" y="42" text-anchor="middle" fill="#0F1419" font-size="20" font-weight="500">Prover</text>
      <text x="100" y="68" text-anchor="middle" fill="#5b6470" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" letter-spacing="0.1em">STAKE · STORE · PROVE</text>
      <text x="100" y="100" text-anchor="middle" fill="#5b6470" font-size="13">disk + bandwidth</text>
      <text x="100" y="118" text-anchor="middle" fill="#5b6470" font-size="13">USDC stake bond</text>
    </g>

    <!-- Ethereum / Base -->
    <g transform="translate(560, 80)">
      <rect width="200" height="140" rx="16" fill="#fbfcfd" stroke="#cdd5dd" stroke-width="1.2"/>
      <text x="100" y="42" text-anchor="middle" fill="#0F1419" font-size="20" font-weight="500">Ethereum</text>
      <text x="100" y="68" text-anchor="middle" fill="#5b6470" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" letter-spacing="0.1em">VERIFY · SLASH · PAY</text>
      <text x="100" y="100" text-anchor="middle" fill="#5b6470" font-size="13">Base L2 settlement</text>
      <text x="100" y="118" text-anchor="middle" fill="#5b6470" font-size="13">USDC · ENS</text>
    </g>

    <!-- Top arrows: Client → Prover → Ethereum -->
    <g stroke="#0F4C5C" stroke-width="1.6" fill="none" opacity="0.55">
      <path d="M240 130 L300 130" marker-end="url(#arrow)"/>
      <path d="M500 130 L560 130" marker-end="url(#arrow)"/>
    </g>

    <!-- Bottom return arc: Ethereum → Prover → Client (settlement) -->
    <path d="M650 220 Q650 285 500 285 L300 285 Q150 285 150 220"
          fill="none" stroke="#0F4C5C" stroke-width="1.6"
          stroke-dasharray="4 5" opacity="0.45"
          marker-end="url(#arrow)"/>

    <!-- Top arrow labels -->
    <g fill="#0F4C5C" font-size="10.5" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.12em" text-anchor="middle">
      <text x="270" y="118">PIECE</text>
      <text x="530" y="118">PROOF</text>
    </g>

    <!-- Bottom arc label -->
    <text x="400" y="313" text-anchor="middle" fill="#5b6470"
          font-size="10.5" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.16em">
      SETTLEMENT · USDC PAYOUT · SLASHING
    </text>

    <!-- Title strip -->
    <text x="40" y="48" fill="#0F4C5C" font-size="11" font-weight="600" letter-spacing="0.16em" font-family="ui-monospace, 'SF Mono', monospace">
      PROVA · ARCHITECTURE
    </text>
    <line x1="40" y1="56" x2="200" y2="56" stroke="url(#provaTeal)" stroke-width="2"/>
  </g>
</svg>
