<?xml version="1.0" encoding="UTF-8"?>
<!-- Prova logo v2 small-size variant: optimized for 16-64px.
     - Solid-fill triangle (ring detail collapses at small sizes)
     - No gap in ring (gap is pixel-noise below 48px)
     - No inner glow (halo wastes pixels)
     - No focal dot (merges into triangle) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="chromeSm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0DBF0"/>
      <stop offset="100%" stop-color="#2B5CFF"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#chromeSm)" stroke-width="14"/>
  <polygon points="74,62 144,100 74,138"
           fill="url(#chromeSm)"
           transform="rotate(-4 100 100)"/>
</svg>
