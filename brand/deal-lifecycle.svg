<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Prova deal lifecycle: Proposed, Downloading, Storing, Active, Settled">
  <defs>
    <linearGradient id="provaTeal2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#5DC3E5"/>
      <stop offset="50%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#0F4C5C"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F4C5C" opacity="0.65"/>
    </marker>
  </defs>

  <rect width="800" height="240" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <!-- Title -->
    <text x="40" y="40" fill="#0F4C5C" font-size="11" font-weight="600" letter-spacing="0.16em" font-family="ui-monospace, 'SF Mono', monospace">
      PROVA · DEAL LIFECYCLE
    </text>
    <line x1="40" y1="48" x2="200" y2="48" stroke="url(#provaTeal2)" stroke-width="2"/>

    <!-- Timeline -->
    <line x1="80" y1="120" x2="720" y2="120" stroke="#cdd5dd" stroke-width="1.4"/>

    <!-- Five stages -->
    <g>
      <!-- Proposed -->
      <g transform="translate(80, 120)">
        <circle r="12" fill="#fbfcfd" stroke="#0F4C5C" stroke-width="2"/>
        <text x="0" y="-30" text-anchor="middle" fill="#0F1419" font-size="14" font-weight="500">Proposed</text>
        <text x="0" y="42" text-anchor="middle" fill="#5b6470" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.06em">CLIENT ESCROW</text>
      </g>
      <!-- Downloading -->
      <g transform="translate(240, 120)">
        <circle r="12" fill="#fbfcfd" stroke="#5DC3E5" stroke-width="2"/>
        <text x="0" y="-30" text-anchor="middle" fill="#0F1419" font-size="14" font-weight="500">Downloading</text>
        <text x="0" y="42" text-anchor="middle" fill="#5b6470" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.06em">FETCH + VERIFY CID</text>
      </g>
      <!-- Storing -->
      <g transform="translate(400, 120)">
        <circle r="12" fill="#fbfcfd" stroke="#2EC4B6" stroke-width="2"/>
        <text x="0" y="-30" text-anchor="middle" fill="#0F1419" font-size="14" font-weight="500">Storing</text>
        <text x="0" y="42" text-anchor="middle" fill="#5b6470" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.06em">DISK COMMIT</text>
      </g>
      <!-- Active -->
      <g transform="translate(560, 120)">
        <circle r="14" fill="url(#provaTeal2)" stroke="#0F4C5C" stroke-width="2"/>
        <text x="0" y="-30" text-anchor="middle" fill="#0F1419" font-size="14" font-weight="500">Active</text>
        <text x="0" y="42" text-anchor="middle" fill="#5b6470" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.06em">PROOF EVERY 30s</text>
      </g>
      <!-- Settled -->
      <g transform="translate(720, 120)">
        <circle r="12" fill="#fbfcfd" stroke="#0F4C5C" stroke-width="2"/>
        <text x="0" y="-30" text-anchor="middle" fill="#0F1419" font-size="14" font-weight="500">Settled</text>
        <text x="0" y="42" text-anchor="middle" fill="#5b6470" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.06em">PAYOUT</text>
      </g>
    </g>

    <!-- Side branch: Slashed -->
    <g transform="translate(560, 200)">
      <circle r="10" fill="#fbfcfd" stroke="#a4231a" stroke-width="2"/>
      <text x="20" y="4" fill="#a4231a" font-size="13" font-weight="500">Slashed</text>
      <text x="20" y="22" fill="#5b6470" font-size="11" font-family="ui-monospace, 'SF Mono', monospace" letter-spacing="0.06em">FAIL N PROOFS · BURN STAKE · REFUND</text>
      <line x1="0" y1="-10" x2="0" y2="-65" stroke="#a4231a" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
    </g>
  </g>
</svg>
