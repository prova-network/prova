<?xml version="1.0" encoding="UTF-8"?>
<!-- "Update available" variant: main mark + small dot in top-right
     corner as the classic "notification" convention. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <circle cx="11" cy="11" r="8" fill="none" stroke="#000" stroke-width="1.6"/>
  <polygon points="8,6 16,11 8,16" fill="#000"/>
  <!-- Notification dot (2.5px radius, top-right). Apple HIG convention. -->
  <circle cx="18" cy="4" r="2.5" fill="#000"/>
</svg>
