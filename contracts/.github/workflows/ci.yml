name: CI

# Standalone CI for prova-network/contracts.
# Runs on every push and PR. Same pipeline as the umbrella's contracts-ci
# but rooted at the repo root (contracts/ IS the repo here).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write   # for slither SARIF upload

jobs:
  build:
    name: Build + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin deps
        run: |
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts --no-commit
          fi
          if [ ! -d lib/openzeppelin-contracts-upgradeable ]; then
            forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          fi

      - name: forge fmt --check
        run: forge fmt --check
        continue-on-error: true

      - name: forge build --sizes
        run: forge build --sizes

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin deps
        run: |
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts --no-commit
          fi
          if [ ! -d lib/openzeppelin-contracts-upgradeable ]; then
            forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          fi

      - name: forge test
        run: forge test -vv

      - name: gas snapshot
        run: |
          if [ -f .gas-snapshot ]; then
            forge snapshot --check || echo "::warning::Gas snapshot drift; rerun forge snapshot to update."
          else
            echo "::notice::No .gas-snapshot baseline yet."
            forge snapshot
          fi
        continue-on-error: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin deps
        run: |
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts --no-commit
          fi
          if [ ! -d lib/openzeppelin-contracts-upgradeable ]; then
            forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          fi

      - name: forge coverage (lcov + summary)
        run: |
          forge coverage --report lcov --report summary > coverage-summary.txt 2>&1 || true
          tail -50 coverage-summary.txt
          if [ -f lcov.info ]; then
            mv lcov.info coverage.lcov
          fi
        continue-on-error: true

      - name: Upload lcov
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: ignore
          retention-days: 7

  slither:
    name: Slither
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin deps
        run: |
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts --no-commit
          fi
          if [ ! -d lib/openzeppelin-contracts-upgradeable ]; then
            forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          fi

      - name: Build for slither
        run: forge build

      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: '.'
          slither-config: slither.config.json
          fail-on: high
          slither-args: --exclude-dependencies --exclude-informational --exclude-low
          sarif: slither-results.sarif

      - name: Upload SARIF
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
        continue-on-error: true
