# SPDX-License-Identifier: MIT
# Build release artifacts on every `v*` tag and attach them to the GitHub
# release. Ships:
#   - provad-<tag>-linux-amd64.tar.gz
#   - provad-<tag>-linux-arm64.tar.gz
#   - provad-<tag>-darwin-amd64.tar.gz
#   - provad-<tag>-darwin-arm64.tar.gz
#   - checksums.txt  (sha256 of each archive)
#
# The install.sh one-liner pulls these directly. Keep the naming stable.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for manual runs)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: prover/go.sum

      - name: Build
        working-directory: prover
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist

          # Windows needs the .exe extension.
          BINARY="provad"
          if [[ "$GOOS" == "windows" ]]; then BINARY="provad.exe"; fi

          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X main.commit=${COMMIT}" \
            -o "dist/${BINARY}" \
            ./cmd/provad

          # Tar/zip for standalone installers.
          if [[ "$GOOS" == "windows" ]]; then
            ASSET="provad-${TAG}-${GOOS}-${GOARCH}.zip"
            (cd dist && zip -q "${ASSET}" "${BINARY}")
          else
            ASSET="provad-${TAG}-${GOOS}-${GOARCH}.tar.gz"
            tar -C dist -czf "dist/${ASSET}" "${BINARY}"
          fi
          shasum -a 256 "dist/${ASSET}" | awk '{print $1 "  " $2}' | sed "s|dist/||" > "dist/${ASSET}.sha256"

          # Also pack the raw binary for desktop-app bundling (electron-builder
          # pulls ../prover/dist/<os>-<arch>/ per electron-builder.yml extraResources).
          mkdir -p "dist/${GOOS}-${GOARCH}"
          cp "dist/${BINARY}" "dist/${GOOS}-${GOARCH}/${BINARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: provad-${{ matrix.os }}-${{ matrix.arch }}
          path: prover/dist/provad-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate + sum
        run: |
          mkdir -p release
          find artifacts -name 'provad-*.tar.gz' -exec cp {} release/ \;
          cd release
          shasum -a 256 *.tar.gz > checksums.txt
          ls -la

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/provad-*.tar.gz
            release/checksums.txt
          generate_release_notes: true
