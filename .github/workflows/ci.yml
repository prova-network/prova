name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build all crates
        run: cargo build --workspace
      - name: Build release
        run: cargo build --workspace --release

  test:
    name: Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [prova-chain, prova-node, prova-sdk]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --package ${{ matrix.crate }} -- --nocapture
      - name: Run tests (release)
        run: cargo test --package ${{ matrix.crate }} --release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Run audit
        run: cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked || true
      - name: Run coverage
        run: cargo tarpaulin --workspace --out xml --skip-clean
      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        run: echo "Coverage report generated"

  bench:
    name: Benchmark Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Run benchmarks
        run: cargo test --package prova-chain -- bench_ --nocapture 2>&1 | tee bench-output.txt
      - name: Benchmark regression check
        run: cargo test --package prova-chain bench_history -- --nocapture

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  test-hexa:
    name: Tests (self-hosted, Hexa)
    runs-on: [self-hosted, linux, x64, hexa]
    steps:
      - uses: actions/checkout@v4

      - name: Rust version
        run: |
          source ~/.cargo/env
          rustc --version
          cargo --version

      - name: Build
        run: |
          source ~/.cargo/env
          cargo build --workspace

      - name: Test all crates
        run: |
          source ~/.cargo/env
          cargo test --workspace -- --nocapture

      - name: Clippy
        run: |
          source ~/.cargo/env
          rustup component add clippy 2>/dev/null || true
          cargo clippy --workspace -- -D warnings
