name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Solidity ────────────────────────────────────────────────────────
  contracts:
    name: Contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin deps
        run: |
          # remappings.txt points at lib/openzeppelin-contracts{,-upgradeable}
          # They are submodules or fetched via forge install; ensure present.
          if [ ! -d lib/openzeppelin-contracts ]; then
            forge install OpenZeppelin/openzeppelin-contracts --no-commit
          fi
          if [ ! -d lib/openzeppelin-contracts-upgradeable ]; then
            forge install OpenZeppelin/openzeppelin-contracts-upgradeable --no-commit
          fi

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

  # ── Go prover ──────────────────────────────────────────────────────
  prover:
    name: Prover (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prover
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: prover/go.sum

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  # ── Shell scripts ──────────────────────────────────────────────────
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check install/uninstall
        run: |
          shellcheck install.sh uninstall.sh
          shellcheck prover/internal/soaktest/run.sh
          shellcheck prover/scripts/gen-bindings.sh

      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
